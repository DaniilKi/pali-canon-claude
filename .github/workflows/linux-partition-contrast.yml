name: Native Linux partition contrast
on:
  push:
    branches: ['diagnostic/pali-linux-partition-nov27-*']
permissions:
  contents: read
jobs:
  native-linux-contrast:
    name: Native Linux A/B / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original fixture Python
        timeout-minutes: 1
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print("fixture-python", sys.executable, sys.version)'
      - run: npm ci --no-audit --no-fund
      - name: Fetch exact D and canonical fixture inputs
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d11ae70bbb7334402f23bf948944e7bab6d55241
          git cat-file -e 'd11ae70bbb7334402f23bf948944e7bab6d55241^{commit}'
          git fetch --no-tags --depth=1 origin 104b57a6891ddae645c51e39eb3d27b89b64ffdf
          git cat-file -e '104b57a6891ddae645c51e39eb3d27b89b64ffdf^{commit}'
      - name: Build unchanged D runtime
        timeout-minutes: 5
        run: npm run build
      - name: Prepare exact source comparison and owned phase controller
        timeout-minutes: 2
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/linux-partition-contrast.py" <<'PY'
          # One-off diagnostic controller. Not a production loader or test helper.
          from pathlib import Path
          import hashlib,json,os,re,signal,subprocess,sys,time
          D='d11ae70bbb7334402f23bf948944e7bab6d55241'
          ROOT=Path.cwd();OUT=ROOT/'linux-contrast-artifacts';OUT.mkdir(exist_ok=True)
          NODE_FILES=['tests/approved-acceptance.test.mjs','tests/approved-current339-authority-negatives.test.mjs','tests/four-boundary-history.test.mjs','tests/six-boundary-history.test.mjs','tests/six-operation-scope.test.mjs']
          BEFORE={
           NODE_FILES[0]:'c52b29e6dbf8fe65a5433bb9a37ae932497138e0343506b3a88166fcdb9f6414',
           NODE_FILES[1]:'4808d2365fb486467b256ca7abcf42de4296d1cb8fed4c2e8d209cf630e7316e',
           NODE_FILES[2]:'04766af34b9833a0208efb611bb00734c847849958cb93d996fd20c8b50bf664',
           NODE_FILES[3]:'ce62a98ce846014478cc849a7a6ce1461209ea56fdcaa99dede29276c806374b',
           NODE_FILES[4]:'c7d7a29c6ce7430ebb0a84c3f10fcd96ce985e0b93416396d965c98bef019dc6'}
          AFTER={**BEFORE,NODE_FILES[3]:'c70b703d55f8f4f0874a857bfc214f686bb7faae1b3c3dbf54f8c124ba86b938',NODE_FILES[4]:'72b00f45acdd4fac55c5ca274bdfc34da7e383e2be8b184cb8f73afcb1dff139'}
          FIXED={'tests/helpers/partitioned-python.mjs':'31b57009d667c0d88dfd73b849f0e9506e39ae9e26ab11b27b01cf0a3f9066f3','scripts/check-python-partitions.mjs':'4ef5df2648ef909b4270413b9162a802db20d71d8f6e2b34d90f9d336980e2a0','scripts/ci-python-partition-driver.py':'e8b89a5aed517be5c1303ca135f9a4964ee58d451444e2e83090a4f363b128f3','tests/six_boundary_history_acceptance.py':'1d360d565fc9f534fe27bca1dee6388f8faad516ff0ae57803aee6a23162aa55','tests/six_operation_scope_controls.py':'e4bc5488f629b6637a0adec4daf719134abe97ca123897f906da0ac8176ab570'}
          EXTRA_PY=['tests/approved_acceptance.py','tests/approved_current339_authority_negatives.py','tests/four_boundary_history_acceptance.py']
          ARGV=['node','--test','--test-reporter=tap',*NODE_FILES]
          EXPECTED_PARTITIONS={'six-history': {'script': 'tests/six_boundary_history_acceptance.py', 'sha256': '1d360d565fc9f534fe27bca1dee6388f8faad516ff0ae57803aee6a23162aa55', 'cap': 1048576, 'parts': {'heavy': ['ci_partition_six_history.SixHistoryControls.test_02_cached_positive_does_not_hide_any_current_data_mutation'], 'remaining': ['ci_partition_six_history.SixHistoryControls.test_01_exact_positive_and_explicit_historical_logical_frame', 'ci_partition_six_history.SixHistoryControls.test_03_every_source_runtime_and_parent_proof_refuses_loss_and_tampering', 'ci_partition_six_history.SixHistoryControls.test_04_original_C1_bytes_cannot_replace_actual_future_data', 'ci_partition_six_history.SixHistoryControls.test_05_C1_fixture_tampering_and_symlink_refuse_after_positive', 'ci_partition_six_history.SixHistoryControls.test_06_pure_inverse_preserves_unrelated_mutations_but_complete_gate_refuses_them', 'ci_partition_six_history.SixHistoryControls.test_07_runtime_parent_and_full343_objects_are_mandatory']}}, 'six-operation-scope': {'script': 'tests/six_operation_scope_controls.py', 'sha256': 'e4bc5488f629b6637a0adec4daf719134abe97ca123897f906da0ac8176ab570', 'cap': 262144, 'parts': {'heavy': ['ci_partition_six_operation_scope.SixOperationScopeControls.test_04_new_public_calls_recheck_actual_data_despite_same_size_and_mtime'], 'remaining': ['ci_partition_six_operation_scope.SixOperationScopeControls.test_01_verified_immutable_original_bytes_within_one_operation', 'ci_partition_six_operation_scope.SixOperationScopeControls.test_02_public_gates_reject_active_and_closed_internal_scopes', 'ci_partition_six_operation_scope.SixOperationScopeControls.test_03_exception_closes_and_prevents_escaped_reuse', 'ci_partition_six_operation_scope.SixOperationScopeControls.test_05_mandatory_proofs_are_physical_even_inside_a_valid_operation', 'ci_partition_six_operation_scope.SixOperationScopeControls.test_06_every_original_fixture_is_verified_before_operation_use', 'ci_partition_six_operation_scope.SixOperationScopeControls.test_07_mutation_after_capture_never_survives_the_next_operation']}}}
          CACHE=Path(os.environ['RUNNER_TEMP'])/'linux-contrast-inputs'
          H=lambda b:hashlib.sha256(b).hexdigest()
          def command(args):return subprocess.check_output(args,cwd=ROOT,timeout=20)
          def save(name,value):
           p=OUT/name;assert not p.exists();p.write_text(json.dumps(value,indent=2)+'\n')
          def absent(pid,group=False):
           try:(os.killpg if group else os.kill)(pid,0);return False
           except ProcessLookupError:return True
           except PermissionError:return False
          
          def prepare():
           assert sys.platform=='linux' and sys.version_info[:2]==(3,12)
           assert not CACHE.exists();CACHE.mkdir()
           current=command(['git','rev-parse','HEAD']).decode().strip();assert current==os.environ['GITHUB_SHA']
           changed=command(['git','diff','--no-renames','--name-only',D,'HEAD']).decode().splitlines()
           assert sorted(changed)==sorted([*NODE_FILES[-2:],'.github/workflows/linux-partition-contrast.yml'])
           assert command(['git','diff','--name-only']).strip()==b''
           for path,pin in BEFORE.items():
            data=command(['git','show',D+':'+path]);assert H(data)==pin
            if path in NODE_FILES[-2:]:
             after=(ROOT/path).read_bytes();assert H(after)==AFTER[path]
             (CACHE/(Path(path).name+'.A')).write_bytes(data);(CACHE/(Path(path).name+'.B')).write_bytes(after)
            else:assert H((ROOT/path).read_bytes())==pin
           for path,pin in FIXED.items():assert H((ROOT/path).read_bytes())==H(command(['git','show',D+':'+path]))==pin
           extra={path:H(command(['git','show',D+':'+path]))for path in EXTRA_PY}
           for path,pin in extra.items():assert H((ROOT/path).read_bytes())==pin
           node=json.loads(command(['node','-e',"process.stdout.write(JSON.stringify({platform:process.platform,node:process.version,availableParallelism:require('node:os').availableParallelism()}))"]))
           assert node['platform']=='linux' and int(node['node'].split('.')[0][1:])==int(os.environ['EXPECTED_NODE_MAJOR'])
           assert isinstance(node['availableParallelism'],int)and node['availableParallelism']>0
           identity={'schema':'native-linux-partition-contrast-identity-v1','source_D':D,'diagnostic_commit':current,'argv':ARGV,'normal_Linux_Node_file_concurrency':True,'node':node,'Python':{'executable':sys.executable,'version':sys.version},'runner':{k:os.environ.get(k)for k in ['ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH']},'source_before':BEFORE,'source_after':AFTER,'fixed_sources':FIXED,'extra_Python_sources':extra,'fixed_order':'A then B on the same job host','five_file_context_not_full2092_or_causal_reproduction':True,'general_descendant_absence_guarantee':False}
           save('identity.json',identity)
          
          def verify_B_partitions(out,err,node):
           rows=[json.loads(value)for value in re.findall(rb'(?m)^(?:# )?PYTHON_PARTITIONS_RESULT:([^\r\n]+)\r?$',out+b'\n'+err)]
           assert len(rows)==2 and {r['suite']for r in rows}==set(EXPECTED_PARTITIONS),'Exactly two actual suite diagnostics required'
           verified=[]
           for row in rows:
            plan=EXPECTED_PARTITIONS[row['suite']]
            assert row['schema']=='ci-python-partitions-result-v1'and row['production']is True and row['platform']=='linux'and row['node']==node['node'].removeprefix('v')
            assert row['source_script']==plan['script']and row['source_sha256']==plan['sha256']
            assert row['child_timeout_ms']==60000 and row['global_outer_ms']==65000 and row['effective_cleanup_deadline_ms']==64750
            assert [c['part']for c in row['children']]==['heavy','remaining']
            for child in row['children']:
             ids=plan['parts'][child['part']];pid=child['pid'];assert isinstance(pid,int)and pid>1
             assert child['spawned']is True and child['terminal_observed']is True and child['closed']is True and child['exit']==0 and child['signal']is None
             assert all(child[key]is None for key in ['error','protocol_error','cleanup_error'])
             assert child['timed_out']is False and child['overflow']is False and child['last_phase']=='runner_returned'
             assert child['stdout_bytes']<=plan['cap']and child['stderr_bytes']<=plan['cap']
             assert child['started_ids']==child['stopped_ids']==ids
             assert child['terminal_results']==[{'test_id':name,'outcome':'success'}for name in ids]
             summary=child['summary'];assert summary['tests_run']==len(ids)and summary['started_ids']==summary['stopped_ids']==ids and summary['terminal_results']==child['terminal_results']
             assert all(summary[key]==0 for key in ['failures','errors','skipped','expected_failures','unexpected_successes'])and summary['was_successful']is True and summary['runner_returned']is True
             assert absent(pid)and absent(pid,True),'Every declared detached helper child must be absent after close'
             if child['cleanup_requested']:assert child['cleanup_verified']is True
            verified.append({'suite':row['suite'],'named_successes':7,'parts':[1,6],'actual_closed_exit0_children':2,'declared_child_PIDs_and_groups_absent':True})
           return verified
          
          def phase(which):
           assert which in ['A','B'];identity=json.loads((OUT/'identity.json').read_text());assert identity['source_D']==D and identity['argv']==ARGV
           if which=='B':
            prior=json.loads((OUT/'phase-A.json').read_text());assert prior['phase']=='A'and prior['diagnostic_commit']==identity['diagnostic_commit']and prior['argv']==ARGV
            assert prior['source_pins_unchanged']is True and prior['cleanup_verified']is True and absent(prior['pid'])and absent(prior['pgid'],True),'B refuses without valid A sources and fresh owned PID/group absence'
           pins=BEFORE if which=='A'else AFTER
           for path in NODE_FILES[-2:]:
            data=(CACHE/(Path(path).name+'.'+which)).read_bytes();assert H(data)==pins[path];(ROOT/path).write_bytes(data)
           for path,pin in {**pins,**FIXED,**identity['extra_Python_sources']}.items():assert H((ROOT/path).read_bytes())==pin
           stdout=OUT/('phase-'+which+'.tap');stderr=OUT/('phase-'+which+'.stderr');assert not stdout.exists()and not stderr.exists()
           started=time.monotonic();timed=False;kill_attempted=False;kill_error=None;waited=False
           with stdout.open('xb')as out,stderr.open('xb')as err:
            p=subprocess.Popen(ARGV,cwd=ROOT,stdout=out,stderr=err,start_new_session=True)
            # start_new_session creates this directly owned group; no global process scans/kills.
            pgid=p.pid
            try:assert os.getpgid(p.pid)==pgid
            except ProcessLookupError:assert p.poll()is not None
            try:p.wait(timeout=330);waited=True
            except subprocess.TimeoutExpired:timed=True
            initial_group_absent=absent(pgid,True)
            if timed or not initial_group_absent:
             kill_attempted=True
             try:os.killpg(pgid,signal.SIGKILL)
             except ProcessLookupError:kill_error='ESRCH'
             except OSError as e:kill_error={'errno':e.errno,'type':type(e).__name__}
            try:p.wait(timeout=5);waited=True
            except subprocess.TimeoutExpired:waited=False
            until=time.monotonic()+5
            while time.monotonic()<until and not(absent(p.pid)and absent(pgid,True)):time.sleep(.05)
           direct_absent=absent(p.pid);group_absent=absent(pgid,True);clean=waited and direct_absent and group_absent
           out=stdout.read_bytes();err=stderr.read_bytes();metrics={};duplicate=False
           for key,value in re.findall(rb'^# (tests|suites|pass|fail|cancelled|skipped|todo) ([0-9]+)\r?$',out,re.M):
            key=key.decode();duplicate=duplicate or key in metrics;metrics[key]=int(value)
           expected={'tests':5,'suites':0,'pass':5,'fail':0,'cancelled':0,'skipped':0,'todo':0}
           source_error=None
           try:source_unchanged=all(H((ROOT/path).read_bytes())==pin for path,pin in {**pins,**FIXED,**identity['extra_Python_sources']}.items())
           except OSError as e:source_unchanged=False;source_error=type(e).__name__
           partition_proofs=[];partition_error=None
           if which=='B':
            try:partition_proofs=verify_B_partitions(out,err,identity['node'])
            except Exception as e:partition_error=type(e).__name__+': '+str(e)
           passed=p.returncode==0 and not timed and clean and not kill_attempted and not duplicate and metrics==expected and source_unchanged and partition_error is None
           result={'schema':'native-linux-partition-contrast-phase-v1','phase':which,'diagnostic_commit':identity['diagnostic_commit'],'source_D':D,'argv':ARGV,'pid':p.pid,'pgid':pgid,'seconds':time.monotonic()-started,'outer_diagnostic_bound_seconds':330,'cleanup_extra_bound_seconds':10,'exit_code':p.returncode,'outer_timed_out':timed,'initial_owned_group_absent':initial_group_absent,'owned_group_kill_attempted':kill_attempted,'kill_error':kill_error,'direct_wait_observed':waited,'final_direct_pid_absent':direct_absent,'final_owned_group_absent':group_absent,'cleanup_verified':clean,'general_descendant_absence_guarantee':False,'detached_B_child_groups_are_helper_owned_not_outer_group_proof':True,'metrics':metrics,'duplicate_summary_key':duplicate,'source_pins_unchanged':source_unchanged,'source_error':source_error,'B_partition_proofs':partition_proofs,'B_partition_error':partition_error,'outcome':'PASS'if passed else('TIMEOUT'if timed else'FAIL'),'stdout_sha256':H(out),'stderr_sha256':H(err),'not_full_CI_or_dev_approval':True}
           save('phase-'+which+'.json',result);print(json.dumps(result),flush=True)
           # Real A failure stays a failed step; explicit B condition handles only measured cleanup.
           return 0 if passed else 1
          
          if __name__=='__main__':
           assert len(sys.argv)==2
           if sys.argv[1]=='prepare':prepare()
           else:sys.exit(phase(sys.argv[1]))
          PY
          python3 "$RUNNER_TEMP/linux-partition-contrast.py" prepare
      - name: Verify unchanged bounded Python partition protocol once
        id: gate
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-python-partitions.mjs 2>&1 | tee linux-contrast-artifacts/protocol.log
      - name: Phase A exact D five wrappers with normal Linux file concurrency
        id: phase_a
        timeout-minutes: 6
        run: python3 "$RUNNER_TEMP/linux-partition-contrast.py" A
      - name: Phase B reviewed Linux partitions after verified A cleanup
        if: ${{ always() && !cancelled() && steps.gate.outcome == 'success' && (steps.phase_a.outcome == 'success' || steps.phase_a.outcome == 'failure') }}
        timeout-minutes: 6
        run: python3 "$RUNNER_TEMP/linux-partition-contrast.py" B
      - name: Preserve both genuine phase outcomes and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-contrast-node${{ matrix.node }}
          path: |
            linux-contrast-artifacts/identity.json
            linux-contrast-artifacts/protocol.log
            linux-contrast-artifacts/phase-A.json
            linux-contrast-artifacts/phase-A.tap
            linux-contrast-artifacts/phase-A.stderr
            linux-contrast-artifacts/phase-B.json
            linux-contrast-artifacts/phase-B.tap
            linux-contrast-artifacts/phase-B.stderr
          if-no-files-found: warn
          retention-days: 7
