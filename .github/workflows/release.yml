name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v2.0.0)
        required: true
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the package and manifest versions
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          test "v$(node -p "require('./manifest.json').version")" = "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Check the committed server matches the build
        run: git diff --exit-code -- server/
      - run: npm run smoke
      - run: npm run pack:desktop
      - name: npm tarball
        run: npm pack --pack-destination dist
      - name: Checksums and release notes
        working-directory: dist
        run: |
          sha256sum *.mcpb *.tgz | tee SHA256SUMS.txt
          { echo '## SHA-256'; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/*.mcpb dist/*.tgz dist/SHA256SUMS.txt"
          [ -d dist/export ] && files="$files dist/export/*"
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" $files --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $pre
          fi
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN not set; npm publish skipped (tarball attached to the release)"; exit 0; fi
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already published"; exit 0; fi
          case "$version" in *-*) npm publish --provenance --access public --tag next;; *) npm publish --provenance --access public;; esac
