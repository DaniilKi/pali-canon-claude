name: Read the full bundled corpus
on:
  workflow_dispatch:
  push:
    branches: ['dev/**', 'integrate/**']
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check committed server bundles
        run: git diff --exit-code -- server/
      - run: npm run corpus:check -- --report corpus-check.report.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('corpus-check.report.json') != ''
        with:
          name: corpus-reading-report
          path: corpus-check.report.json
          if-no-files-found: error
