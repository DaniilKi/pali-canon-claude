name: Evidence reading commands
on:
  push:
    branches: [main, 'dev/**', 'integrate/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack and install the actual npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-pack" "$RUNNER_TEMP/evidence-install"
          npm pack --pack-destination "$RUNNER_TEMP/evidence-pack"
          cd "$RUNNER_TEMP/evidence-install"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/evidence-pack/*.tgz
      - name: Follow every recorded evidence reference offline
        run: node scripts/audit-evidence.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report evidence.report.json
      - name: Read canonical commentary post-canonical and source-file widget selections offline
        run: node scripts/audit-widget.mjs --exhaust-aligned --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report widget-reading.report.json
      - name: Check packaged English continuation against synthetic upstream edits offline
        run: node scripts/audit-english-prefix.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report english-prefix.report.json
      - name: Check packaged talk-search input passage scope and interleaving offline
        run: node scripts/audit-talks.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report talk-pagination.report.json
      - name: Check packaged native word and name lookups with dictionary outage offline
        run: node scripts/audit-lookups.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-lookups.report.json
      - name: Check packaged native paritta selectors and continuations offline
        run: node scripts/audit-paritta.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-paritta.report.json
      - name: Check packaged native Abhidhamma selectors and source commands offline
        run: node scripts/audit-abhidhamma.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-abhidhamma.report.json
      - name: Check packaged native topic and numbered-list selectors offline
        run: node scripts/audit-topics.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-topics.report.json
      - name: Check packaged native Vinaya rule selectors and source commands offline
        run: node scripts/audit-vinaya.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-vinaya.report.json
      - name: Check packaged native Pali quotation verification offline
        run: node scripts/audit-verification.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-verification.report.json
      - name: Check packaged English verification scope and provenance offline
        run: node scripts/audit-english-scope.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report english-verification-scope.report.json
      - name: Check packaged native parallel citations and ambiguous scope offline
        run: node scripts/audit-parallels.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-parallels.report.json
      - name: Check packaged native numeral citation scanning and offsets offline
        run: node scripts/audit-citation-scanner.mjs --server-dir "$RUNNER_TEMP/evidence-install/node_modules/pali-canon-mcp/server" --report native-citation-scanner.report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-reading-report
          path: |
            evidence.report.json
            widget-reading.report.json
            english-prefix.report.json
            talk-pagination.report.json
            native-lookups.report.json
            native-paritta.report.json
            native-abhidhamma.report.json
            native-topics.report.json
            native-vinaya.report.json
            native-verification.report.json
            english-verification-scope.report.json
            native-parallels.report.json
            native-citation-scanner.report.json
          if-no-files-found: warn
