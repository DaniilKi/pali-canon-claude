name: Check package
on:
  push:
    branches: [main, 'dev/**', 'integrate/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-memory:
    name: Hosted memory budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack the committed server
        run: |
          mkdir -p "$RUNNER_TEMP/memory-package" "$RUNNER_TEMP/memory-report"
          npm pack --pack-destination "$RUNNER_TEMP/memory-package"
          tar -xzf "$RUNNER_TEMP/memory-package/"*.tgz -C "$RUNNER_TEMP/memory-package"
      - name: Check packaged HTTP tools resources prompts and errors
        run: |
          cp -R "$RUNNER_TEMP/memory-package/package/server" "$RUNNER_TEMP/memory-package/src"
          node scripts/smoke.mjs --http --server "$RUNNER_TEMP/memory-package/src/http.cjs"
      - name: Check packaged worker failure recovery without changing citations
        run: node scripts/audit-hosted-recovery.mjs --server-dir "$RUNNER_TEMP/memory-package/package/server" --report "$RUNNER_TEMP/memory-report/recovery.json"
      - name: Exercise offline tools under the Fly template's memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/profile-memory.mjs \
            --server-dir /package/server --budget-mb 2048 --report /report/memory.json
      - name: Check cold and warm health under one CPU and the same memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --cpus 1 --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/audit-hosted-load.mjs \
            --server-dir /package/server --clients 16 --rounds 3 --report /report/concurrency.json
      - name: Check retained reader views and the shared live cache under mixed load
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --cpus 1 --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/src,dst=/app/src,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/audit-hosted-load.mjs \
            --server-dir /package/server --clients 24 --rounds 3 --full-cache --reader-caches --reader-ui --report /report/full-cache.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-memory-report
          path: ${{ runner.temp }}/memory-report/*.json
          if-no-files-found: warn
  reader-browser-group:
    name: Chromium reader / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, study, personal, provenance, comparison, notes, backup, conflicts, highlights, navigation, booksearch, chapters]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.group == 'backup' || matrix.group == 'conflicts') && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Build standalone server and reader assets
        run: npm run build
      - name: Check reader layout, continuation and accessibility semantics offline
        if: matrix.group == 'core'
        run: python scripts/widget-browser-check.py --report widget-browser.report.json
      - name: Check standalone web reader against real bundled text
        if: matrix.group == 'core'
        run: |
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-browser-check.py > standalone-reader.report.json
      - name: Check saved source revisions before showing Pāli wording
        if: matrix.group == 'provenance'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-bookmark-pin-check.py --report standalone-bookmark-pin.report.json
      - name: Audit versioned bookmark refusals and legacy review
        if: matrix.group == 'provenance'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-bookmark-pin-check.py --a11y --report standalone-bookmark-pin-a11y.report.json
      - name: Check source-aware Pāli print and PDF privacy
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-print-check.py --report standalone-print.report.json
      - name: Audit standalone reader accessibility in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-a11y-check.py --report standalone-a11y.report.json
      - name: Check shared and partial translation consent with isolated synthetic sources
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-scope-check.py --report standalone-scope.report.json
      - name: Audit scoped-source screens in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-scope-check.py --a11y --report standalone-scope-a11y.report.json
      - name: Check sourced reading plans and local progress
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-plans-check.py --report standalone-plans.report.json
      - name: Audit reading-plan screens in both themes
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-plans-check.py --a11y --report standalone-plans-a11y.report.json
      - name: Check local bookmark restore and exact saved references
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-import-check.py --report standalone-import.report.json
      - name: Check saved-library search paging and private drafts
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-saved-check.py --report standalone-saved.report.json
      - name: Audit saved-library filters and paging in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-saved-check.py --a11y --report standalone-saved-a11y.report.json
      - name: Audit bookmark restore screens in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-import-check.py --a11y --report standalone-import-a11y.report.json
      - name: Check dated daily reading and source boundaries
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-daily-check.py --report standalone-daily.report.json
      - name: Audit dated reading screens in both themes
