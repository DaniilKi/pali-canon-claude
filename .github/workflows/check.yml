name: Check package
on:
  push:
    branches: [main, 'dev/**', 'integrate/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-memory:
    name: Hosted memory budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack the committed server
        run: |
          mkdir -p "$RUNNER_TEMP/memory-package" "$RUNNER_TEMP/memory-report"
          npm pack --pack-destination "$RUNNER_TEMP/memory-package"
          tar -xzf "$RUNNER_TEMP/memory-package/"*.tgz -C "$RUNNER_TEMP/memory-package"
      - name: Check packaged HTTP tools resources prompts and errors
        run: |
          cp -R "$RUNNER_TEMP/memory-package/package/server" "$RUNNER_TEMP/memory-package/src"
          node scripts/smoke.mjs --http --server "$RUNNER_TEMP/memory-package/src/http.cjs"
      - name: Check packaged worker failure recovery without changing citations
        run: node scripts/audit-hosted-recovery.mjs --server-dir "$RUNNER_TEMP/memory-package/package/server" --report "$RUNNER_TEMP/memory-report/recovery.json"
      - name: Exercise offline tools under the Fly template's memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/profile-memory.mjs \
            --server-dir /package/server --budget-mb 2048 --report /report/memory.json
      - name: Check cold and warm health under one CPU and the same memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --cpus 1 --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/audit-hosted-load.mjs \
            --server-dir /package/server --clients 16 --rounds 3 --report /report/concurrency.json
      - name: Check retained reader views and the shared live cache under mixed load
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --cpus 1 --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/src,dst=/app/src,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/web/content-sha256.mjs,dst=/app/web/content-sha256.mjs,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/web/source-notes-policy.mjs,dst=/app/web/source-notes-policy.mjs,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/audit-hosted-load.mjs \
            --server-dir /package/server --clients 24 --rounds 3 --full-cache --reader-caches --reader-ui --report /report/full-cache.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-memory-report
          path: ${{ runner.temp }}/memory-report/*.json
          if-no-files-found: warn
  reader-browser-group:
    name: Chromium reader / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, study, personal, provenance, comparison, notes, backup, conflicts, highlights, navigation, booksearch, chapters, citations, searchpins, headings, commentary, postsearch, vinayapartials, scriptrefresh, milinda, draftsafety, annumbered, milindapartial, anten, apadana, apadananext, apadanathird, apadanafourth, apadanathera, apadanatheranext, apadanatheraexpansion, apadanatherascaled61, apadanatherascaled81, apadanatheraeditorial, apadanatherapair101, apadanatherapair121, apadanathera141, apadanathera161, apadanathera181, apadanathera201, apadanathera221, apadanathera231, apadanathera234, apadanathera241, apadanathera251, apadanaedition, thagsixteen, textspacing, vrieditionnote]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.group == 'apadanathera181' || matrix.group == 'apadanathera201') && 30 || (matrix.group == 'backup' || matrix.group == 'conflicts' || matrix.group == 'personal' || matrix.group == 'postsearch' || matrix.group == 'vinayapartials' || matrix.group == 'draftsafety' || matrix.group == 'milinda' || matrix.group == 'annumbered' || matrix.group == 'milindapartial' || matrix.group == 'anten' || matrix.group == 'apadana' || matrix.group == 'apadananext' || matrix.group == 'apadanathird' || matrix.group == 'apadanafourth' || matrix.group == 'apadanathera' || matrix.group == 'apadanatheranext' || matrix.group == 'apadanatheraexpansion' || matrix.group == 'apadanatherascaled61' || matrix.group == 'apadanatherascaled81' || matrix.group == 'apadanatheraeditorial' || matrix.group == 'apadanatherapair101' || matrix.group == 'apadanatherapair121' || matrix.group == 'apadanathera141' || matrix.group == 'apadanathera161' || matrix.group == 'apadanathera181' || matrix.group == 'apadanathera201' || matrix.group == 'apadanaedition' || matrix.group == 'thagsixteen' || matrix.group == 'textspacing' || matrix.group == 'apadanathera241' || matrix.group == 'apadanathera221' || matrix.group == 'apadanathera231' || matrix.group == 'apadanathera251' || matrix.group == 'apadanathera234' || matrix.group == 'vrieditionnote') && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact reviewed Apadāna baseline for independent preservation checks
        if: matrix.group == 'apadanatherascaled61' || matrix.group == 'apadanatherascaled81' || matrix.group == 'apadanatheraeditorial'
        run: |
          git fetch --no-tags --depth=1 origin 64a336789ab5f4f02964ff3023ea6b26b330e406
          git cat-file -e 64a336789ab5f4f02964ff3023ea6b26b330e406^{commit}
      - name: Fetch exact paired-intake baseline for independent preservation checks
        if: matrix.group == 'apadanatherapair101' || matrix.group == 'apadanatherapair121'
        run: |
          git fetch --no-tags --depth=1 origin b5669a334add97ebc0c3c32f9b3fb45ed90d9780
          git cat-file -e b5669a334add97ebc0c3c32f9b3fb45ed90d9780^{commit}
      - name: Fetch exact 141-180 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera141' || matrix.group == 'apadanathera161'
        run: |
          git fetch --no-tags --depth=1 origin 05fc4e29540fc0799145dc28838bedb7d964b2c7
          git cat-file -e 05fc4e29540fc0799145dc28838bedb7d964b2c7^{commit}
      - name: Fetch exact 181-220 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera181' || matrix.group == 'apadanathera201'
        run: |
          git fetch --no-tags --depth=1 origin 94c607310845b84dc3cd51ba3a19ce6fecd28683
          git cat-file -e 94c607310845b84dc3cd51ba3a19ce6fecd28683^{commit}
      - name: Fetch exact remaining-intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera231' || matrix.group == 'apadanathera251'
        run: |
          git fetch --no-tags --depth=1 origin cdbefd514164a559bc5aaab631c267f3084e31a6
          git cat-file -e cdbefd514164a559bc5aaab631c267f3084e31a6^{commit}
      - name: Fetch exact held234 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera234'
        run: |
          git fetch --no-tags --depth=1 origin 7d5ac90845402b322dabf2c5120d1485b15c0bda
          git cat-file -e 7d5ac90845402b322dabf2c5120d1485b15c0bda^{commit}
      - name: Fetch exact 221-230 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera221'
        run: |
          git fetch --no-tags --depth=1 origin 9ceed785d30afdcdc1f09021d6098b5bb85f02fb
          git cat-file -e 9ceed785d30afdcdc1f09021d6098b5bb85f02fb^{commit}
      - name: Fetch exact 241-250 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera241'
        run: |
          git fetch --no-tags --depth=1 origin a9755d267c309ad930df0ef154e6c8a03f1f371e
          git cat-file -e a9755d267c309ad930df0ef154e6c8a03f1f371e^{commit}
      - name: Fetch exact source-note baseline for independent compatibility checks
        if: matrix.group == 'vrieditionnote'
        run: |
          git fetch --no-tags --depth=1 origin ff798f681147e12160167fbeb9ef1927bb54c45c
          git cat-file -e ff798f681147e12160167fbeb9ef1927bb54c45c^{commit}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Build standalone server and reader assets
        run: npm run build
      - name: Check reader layout, continuation and accessibility semantics offline
        if: matrix.group == 'core'
        run: python scripts/widget-browser-check.py --report widget-browser.report.json
      - name: Check standalone web reader against real bundled text
        if: matrix.group == 'core'
        run: |
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-browser-check.py > standalone-reader.report.json
      - name: Check saved source revisions before showing Pāli wording
        if: matrix.group == 'provenance'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-bookmark-pin-check.py --report standalone-bookmark-pin.report.json
      - name: Audit versioned bookmark refusals and legacy review
        if: matrix.group == 'provenance'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-bookmark-pin-check.py --a11y --report standalone-bookmark-pin-a11y.report.json
      - name: Check source-aware Pāli print and PDF privacy
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-print-check.py --report standalone-print.report.json
      - name: Audit standalone reader accessibility in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-a11y-check.py --report standalone-a11y.report.json
      - name: Check shared and partial translation consent with isolated synthetic sources
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-scope-check.py --report standalone-scope.report.json
      - name: Audit scoped-source screens in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-scope-check.py --a11y --report standalone-scope-a11y.report.json
      - name: Check sourced reading plans and local progress
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-plans-check.py --report standalone-plans.report.json
      - name: Audit reading-plan screens in both themes
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-plans-check.py --a11y --report standalone-plans-a11y.report.json
      - name: Check local bookmark restore and exact saved references
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-import-check.py --report standalone-import.report.json
      - name: Check saved-library search paging and private drafts
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-saved-check.py --report standalone-saved.report.json
      - name: Audit saved-library filters and paging in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-saved-check.py --a11y --report standalone-saved-a11y.report.json
      - name: Audit bookmark restore screens in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-import-check.py --a11y --report standalone-import-a11y.report.json
      - name: Check dated daily reading and source boundaries
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-daily-check.py --report standalone-daily.report.json
      - name: Audit dated reading screens in both themes
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-daily-check.py --a11y --report standalone-daily-a11y.report.json
      - name: Check compact phone reading and responsive focus
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-compact-check.py --report standalone-compact.report.json
      - name: Audit compact reading disclosures in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-compact-check.py --a11y --report standalone-compact-a11y.report.json
      - name: Check Pāli quotation matching and exact source links
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-quote-check.py --report standalone-quote.report.json
      - name: Audit quotation checker in both themes
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-quote-check.py --a11y --report standalone-quote-a11y.report.json
      - name: Check English-source catalogue filters and exact reading links
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-english-catalogue-check.py --report standalone-english-catalogue.report.json
      - name: Audit English-source catalogue in both themes
        if: matrix.group == 'study'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-english-catalogue-check.py --a11y --report standalone-english-catalogue-a11y.report.json
      - name: Check the installed English-source catalogue outside the source tree
        if: matrix.group == 'study'
        run: |
          mkdir -p "$RUNNER_TEMP/english-package"
          npm pack --pack-destination "$RUNNER_TEMP/english-package"
          tar -xzf "$RUNNER_TEMP/english-package/"*.tgz -C "$RUNNER_TEMP/english-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-english-catalogue-check.py --server-dir "$RUNNER_TEMP/english-package/package/server" --report installed-english-catalogue.report.json
      - name: Check explicit English-source comparison and independent continuations
        if: matrix.group == 'comparison'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-comparison-check.py --report standalone-comparison.report.json
      - name: Audit English comparison in both themes
        if: matrix.group == 'comparison'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-comparison-check.py --a11y --report standalone-comparison-a11y.report.json
      - name: Check installed English comparison outside the source tree
        if: matrix.group == 'comparison'
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-package"
          npm pack --pack-destination "$RUNNER_TEMP/comparison-package"
          tar -xzf "$RUNNER_TEMP/comparison-package/"*.tgz -C "$RUNNER_TEMP/comparison-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-comparison-check.py --server-dir "$RUNNER_TEMP/comparison-package/package/server" --report installed-comparison.report.json
      - name: Check in-context private notes and safe removal across source types
        if: matrix.group == 'notes'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-notes-check.py --report standalone-notes.report.json
      - name: Audit passage-note editing and removal in both themes
        if: matrix.group == 'notes'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-notes-check.py --a11y --report standalone-notes-a11y.report.json
      - name: Check installed passage-note workflows outside the source tree
        if: matrix.group == 'notes'
        run: |
          mkdir -p "$RUNNER_TEMP/notes-package"
          npm pack --pack-destination "$RUNNER_TEMP/notes-package"
          tar -xzf "$RUNNER_TEMP/notes-package/"*.tgz -C "$RUNNER_TEMP/notes-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-notes-check.py --server-dir "$RUNNER_TEMP/notes-package/package/server" --report installed-notes.report.json
      - name: Check local study-backup transfer and interrupted restore guards
        if: matrix.group == 'backup'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-backup-check.py --report standalone-backup.report.json
      - name: Audit study-backup controls and previews in both themes
        if: matrix.group == 'backup'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-backup-check.py --a11y --report standalone-backup-a11y.report.json
      - name: Check installed study-backup workflows outside the source tree
        if: matrix.group == 'backup'
        run: |
          mkdir -p "$RUNNER_TEMP/backup-package"
          npm pack --pack-destination "$RUNNER_TEMP/backup-package"
          tar -xzf "$RUNNER_TEMP/backup-package/"*.tgz -C "$RUNNER_TEMP/backup-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-backup-check.py --server-dir "$RUNNER_TEMP/backup-package/package/server" --report installed-backup.report.json
      - name: Check explicit personal-note conflict choices and rollback
        if: matrix.group == 'conflicts'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-note-conflicts-check.py --report standalone-note-conflicts.report.json
      - name: Audit personal-note conflict review in both themes
        if: matrix.group == 'conflicts'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-note-conflicts-check.py --a11y --report standalone-note-conflicts-a11y.report.json
      - name: Check installed personal-note conflict review outside the source tree
        if: matrix.group == 'conflicts'
        run: |
          mkdir -p "$RUNNER_TEMP/conflicts-package"
          npm pack --pack-destination "$RUNNER_TEMP/conflicts-package"
          tar -xzf "$RUNNER_TEMP/conflicts-package/"*.tgz -C "$RUNNER_TEMP/conflicts-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-note-conflicts-check.py --server-dir "$RUNNER_TEMP/conflicts-package/package/server" --report installed-note-conflicts.report.json
      - name: Check source-pinned saved-passage highlights and live preference safety
        if: matrix.group == 'highlights'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-highlights-check.py --report standalone-highlights.report.json
      - name: Audit saved-passage highlights in both themes
        if: matrix.group == 'highlights'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-highlights-check.py --a11y --report standalone-highlights-a11y.report.json
      - name: Check installed source-aware highlights outside the source tree
        if: matrix.group == 'highlights'
        run: |
          mkdir -p "$RUNNER_TEMP/highlights-package"
          npm pack --pack-destination "$RUNNER_TEMP/highlights-package"
          tar -xzf "$RUNNER_TEMP/highlights-package/"*.tgz -C "$RUNNER_TEMP/highlights-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-highlights-check.py --server-dir "$RUNNER_TEMP/highlights-package/package/server" --report installed-highlights.report.json
