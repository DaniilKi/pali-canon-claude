        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-english-catalogue-check.py --report standalone-english-catalogue.report.json
      - name: Audit English-source catalogue in both themes
