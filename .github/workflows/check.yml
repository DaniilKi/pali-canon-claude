name: Check package
on:
  push:
    branches: [main, 'dev/**', 'integrate/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-memory:
    name: Hosted memory budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack the committed server
        run: |
          mkdir -p "$RUNNER_TEMP/memory-package" "$RUNNER_TEMP/memory-report"
          npm pack --pack-destination "$RUNNER_TEMP/memory-package"
          tar -xzf "$RUNNER_TEMP/memory-package/"*.tgz -C "$RUNNER_TEMP/memory-package"
      - name: Check packaged HTTP tools resources prompts and errors
        run: |
          cp -R "$RUNNER_TEMP/memory-package/package/server" "$RUNNER_TEMP/memory-package/src"
          node scripts/smoke.mjs --http --server "$RUNNER_TEMP/memory-package/src/http.cjs"
      - name: Exercise offline tools under the Fly template's memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/profile-memory.mjs \
            --server-dir /package/server --budget-mb 2048 --report /report/memory.json
      - name: Check cold and warm health under one CPU and the same memory limit
        run: |
          memory=$(sed -n 's/^  memory = "\([^"]*\)"/\1/p' fly.toml)
          test -n "$memory"
          docker run --rm --cpus 1 --memory "$memory" --memory-swap "$memory" --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/memory-package/package,dst=/package,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules,dst=/app/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/memory-report,dst=/report" \
            node:20-slim node /app/scripts/audit-hosted-load.mjs \
            --server-dir /package/server --clients 16 --rounds 3 --report /report/concurrency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-memory-report
          path: ${{ runner.temp }}/memory-report/*.json
          if-no-files-found: warn
  reader-browser:
    name: Chromium reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Check reader layout, continuation and accessibility semantics offline
        run: python scripts/widget-browser-check.py --report widget-browser.report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-browser-report
          path: widget-browser.report.json
          if-no-files-found: warn
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings on Windows too, so the build and the committed server/ compare byte for byte.
      - name: Use LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke
      - run: npm run pack:desktop
      # Exhaust every shipped text once; npx.yml checks all lazy datasets on each OS.
      - name: Audit the isolated installed corpus offline
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npm run audit:installed
      # One leg is enough for the staleness check; the build is the same on every platform.
      - name: Check committed standalone server is current
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: git diff --exit-code -- server/
