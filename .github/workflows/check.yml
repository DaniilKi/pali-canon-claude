      - name: Check in-context private notes and safe removal across source types
        if: matrix.group == 'notes'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-notes-check.py --report standalone-notes.report.json
      - name: Audit passage-note editing and removal in both themes
