      - name: Check the installed English-source catalogue outside the source tree
        if: matrix.group == 'study'
        run: |
          mkdir -p "$RUNNER_TEMP/english-package"
          npm pack --pack-destination "$RUNNER_TEMP/english-package"
          tar -xzf "$RUNNER_TEMP/english-package/"*.tgz -C "$RUNNER_TEMP/english-package"
          PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-english-catalogue-check.py --server-dir "$RUNNER_TEMP/english-package/package/server" --report installed-english-catalogue.report.json
      - name: Check explicit English-source comparison and independent continuations
        if: matrix.group == 'comparison'
