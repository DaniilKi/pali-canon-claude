      - name: Check browser stop, retry, deadlines and superseded reading requests
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-recovery-check.py --report standalone-recovery.report.json
      - name: Audit pending-request and recovery states in both themes
        if: matrix.group == 'core'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-recovery-check.py --a11y --report standalone-recovery-a11y.report.json
      - name: Check exact reading position, sharing and source-version refusal
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-position-check.py --report standalone-position.report.json
      - name: Audit exact reading position and privacy controls in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-position-check.py --a11y --report standalone-position-a11y.report.json
      - name: Check reading-only cross-tab reconciliation and stale-note protection
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-pointer-check.py --report standalone-pointer.report.json
      - name: Audit cross-tab note, reading and import flows in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-pointer-check.py --a11y --report standalone-pointer-a11y.report.json
      - name: Check stale-tab saves and personal-data recovery downloads
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-storage-check.py --report standalone-storage.report.json
      - name: Audit personal-data recovery in both themes
        if: matrix.group == 'personal'
        run: PALI_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python scripts/web-reader-storage-check.py --a11y --report standalone-storage-a11y.report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-browser-report-${{ matrix.group }}
          path: |
            widget-browser.report.json
            standalone-reader.report.json
            standalone-print.report.json
            standalone-saved.report.json
            standalone-saved-a11y.report.json
            standalone-bookmark-pin.report.json
            standalone-bookmark-pin-a11y.report.json
            standalone-a11y.report.json
            standalone-scope.report.json
            standalone-scope-a11y.report.json
            standalone-plans.report.json
            standalone-plans-a11y.report.json
            standalone-import.report.json
            standalone-import-a11y.report.json
            standalone-daily.report.json
            standalone-daily-a11y.report.json
