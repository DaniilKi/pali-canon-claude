      - name: Fetch exact VRI Book36 for independent English16 source replay
        if: matrix.group == 'apadana'
        uses: actions/checkout@v4
        with:
          repository: VipassanaTech/tipitaka-xml
          ref: 2d134ff9ef60f70a1eb03c9370580228811a3070
          path: .fixtures/vri-english335-350
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: romn/s0510m1.mul.xml
      - name: Replay sixteen originals without application parser inputs
        if: matrix.group == 'apadana'
        timeout-minutes: 5
        shell: bash
        run: |
          node scripts/shard-data.mjs --unpack server/data .fixtures/english16-canon
          python3 scripts/apadana/thera335-350/portable_source_replay.py --publisher-checkout .fixtures/apadana-pinned --canon .fixtures/english16-canon/canon.json.gz --vri-xml .fixtures/vri-english335-350/romn/s0510m1.mul.xml --out .fixtures/english16-source-replay
      - name: Validate all Apadāna source and rights pins before browser retrieval
        if: matrix.group == 'apadana'
        run: node scripts/apadana/build.mjs --source .fixtures/apadana-pinned --check
      - name: Require all reviewed publisher261-299 source and client cases
        if: matrix.group == 'apadana'
        timeout-minutes: 10
        shell: bash
        env:
          APADANA_SOURCE_CHECKOUT: .fixtures/apadana-pinned
          APADANA_OFFICIAL_CHECKOUT: .fixtures/apadana-pinned
        run: |
          node --test --test-reporter=tap tests/thera261-280-source.test.mjs tests/thera261-280-client.test.mjs tests/thera281-285-source.test.mjs tests/thera281-285-client.test.mjs tests/thera287-288-source.test.mjs tests/thera287-288-client.test.mjs tests/thera292-299-source.test.mjs tests/thera292-299-client.test.mjs | tee reviewed-publisher261-299.tap
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const tap=readFileSync("reviewed-publisher261-299.tap","utf8"); for(const [key,value] of [["tests",49],["pass",49],["fail",0],["cancelled",0],["skipped",0],["todo",0]]) assert.match(tap,new RegExp("^# "+key+" "+value+"$","m"));'
