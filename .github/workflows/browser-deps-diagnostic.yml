name: Browser dependency install diagnostic
on:
  push:
    branches: ['diagnostic/pali-browser-deps-nov27-*']
permissions:
  contents: read
jobs:
  ubuntu24-held234-install-diagnostic:
    name: Ubuntu 24 scoped APT / genuine held234 reader
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [apadanathera234]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact held234 intake baseline for independent preservation checks
        if: matrix.group == 'apadanathera234'
        run: |
          git fetch --no-tags --depth=1 origin 7d5ac90845402b322dabf2c5120d1485b15c0bda
          git cat-file -e 7d5ac90845402b322dabf2c5120d1485b15c0bda^{commit}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install playwright==1.62.0
      - name: Record runner and browser SDK identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          cat /etc/os-release
          python --version
          python -m playwright --version
      - name: Install the official Chromium browser with Ubuntu dependencies
        shell: bash
        run: |
          set -euo pipefail
          pali_python="$(python -c 'import sys; print(sys.executable)')"
          test "$(python -c 'from importlib.metadata import version; print(version("playwright"))')" = '1.62.0'
          pali_apt_dir="$(mktemp -d "$RUNNER_TEMP/playwright-ubuntu-apt.XXXXXX")"
          trap 'rm -rf "$pali_apt_dir"' EXIT
          chmod 700 "$pali_apt_dir"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          cp /etc/apt/sources.list.d/ubuntu.sources "$pali_apt_dir/ubuntu.sources"
          cmp /etc/apt/sources.list.d/ubuntu.sources "$pali_apt_dir/ubuntu.sources"
          test "$(grep '^Signed-By:' "$pali_apt_dir/ubuntu.sources" | sort -u)" = 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
          mkdir "$pali_apt_dir/empty-sourceparts"
          printf 'Dir::Etc::sourcelist "%s";\nDir::Etc::sourceparts "%s";\n' "$pali_apt_dir/ubuntu.sources" "$pali_apt_dir/empty-sourceparts" > "$pali_apt_dir/apt.conf"
          test "$(sudo env APT_CONFIG="$pali_apt_dir/apt.conf" apt-config shell SelectedList Dir::Etc::sourcelist SelectedParts Dir::Etc::sourceparts)" = "SelectedList='$pali_apt_dir/ubuntu.sources'
          SelectedParts='$pali_apt_dir/empty-sourceparts'"
          sha256sum /etc/apt/sources.list.d/ubuntu.sources "$pali_apt_dir/ubuntu.sources"
          sudo env APT_CONFIG="$pali_apt_dir/apt.conf" "$pali_python" -m playwright install-deps chromium
          cmp /etc/apt/sources.list.d/ubuntu.sources "$pali_apt_dir/ubuntu.sources"
          python -m playwright install chromium
      - name: Build standalone server and reader assets
        run: npm run build
      - name: Check out exact public Apadāna source fixtures without credentials
        if: matrix.group == 'apadana' || matrix.group == 'apadananext' || matrix.group == 'apadanathird' || matrix.group == 'apadanafourth' || matrix.group == 'apadanathera' || matrix.group == 'apadanatheranext' || matrix.group == 'apadanatheraexpansion' || matrix.group == 'apadanatherascaled61' || matrix.group == 'apadanatherascaled81' || matrix.group == 'apadanatheraeditorial' || matrix.group == 'apadanatherapair101' || matrix.group == 'apadanatherapair121' || matrix.group == 'apadanaedition' || matrix.group == 'apadanathera141' || matrix.group == 'apadanathera161' || matrix.group == 'apadanathera181' || matrix.group == 'apadanathera201' || matrix.group == 'apadanathera241' || matrix.group == 'apadanathera221' || matrix.group == 'apadanathera231' || matrix.group == 'apadanathera251' || matrix.group == 'apadanathera234'
        uses: actions/checkout@v4
        with:
          repository: apadana-translation/apadana-site
          ref: fb76b8b4556c559aeaaba852f9bf7ed74ea11fd4
          path: .fixtures/apadana-pinned
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            LICENSE.md
            src/_pages/about.md
            src/_includes/site/footer.njk
