name: Diagnostic Mac22 npm completion
on:
  push:
    branches: ['diagnostic/pali-macos-lifecycle-*']
permissions:
  contents: read
jobs:
  macos-completion:
    name: Diagnostic Mac22 original npm lifecycle
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixture Python version
        timeout-minutes: 1
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print("fixture-python", sys.executable, sys.version.split()[0])'
      - run: npm ci --no-audit --no-fund
      - name: Fetch exact104 canonical artifacts for historical inverse checks
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=1 origin 104b57a6891ddae645c51e39eb3d27b89b64ffdf
          git cat-file -e '104b57a6891ddae645c51e39eb3d27b89b64ffdf^{commit}'
      - name: Fetch exact accepted H for owned historical fixture inputs
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=1 origin 4e9287bd5ebc78aba4b185b017e63eac6547bfd7
          git cat-file -e '4e9287bd5ebc78aba4b185b017e63eac6547bfd7^{commit}'
      - name: Verify complete check command contract
        timeout-minutes: 1
        run: node scripts/ci-check-contract.mjs
      - name: Build complete check artifacts
        timeout-minutes: 5
        run: npm run build
      - name: Verify bounded Python partition protocol
        timeout-minutes: 3
        run: node scripts/check-python-partitions.mjs
      - name: Record actual Node parallelism metadata
        timeout-minutes: 1
        run: node -e 'const os=require("node:os");console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,availableParallelism:os.availableParallelism(),cpuCount:os.cpus().length,diagnosticOnly:true}))'
      - name: Observe unchanged complete npm test inventory
        timeout-minutes: 30
        run: python3 scripts/diagnose-macos-test-completion.py
      - name: Retain metadata-only completion observations
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-macos22-npm-completion
          path: ${{ runner.temp }}/macos-test-completion/
          if-no-files-found: error
          retention-days: 7
