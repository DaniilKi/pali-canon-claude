name: Full Linux22 file scheduling diagnostic
on:
  push:
    branches: ['diagnostic/pali-linux-file-schedule-nov27-*']
permissions:
  contents: read
jobs:
  full-linux22-concurrency2:
    name: Full native Linux22 / diagnostic file concurrency 2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI_TEST_BASELINE_INDEX: docs/evidence/qa/windows20-partitions/BASELINE_368_WINDOWS_PYTHON_PARTITIONS.json
      CI_TEST_BASELINE_SHA: e6097e39016595df5a930bb0c173bd90b441bb235c0782fa6636db3d5e05b186
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixture Python version
        timeout-minutes: 1
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print("fixture-python", sys.executable, sys.version.split()[0])'
      - run: npm ci --no-audit --no-fund
      - name: Fetch unchanged F and exact historical fixture inputs
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 7c55503d63c27fb5ca3e03d33039cc16c1a20784
          git cat-file -e '7c55503d63c27fb5ca3e03d33039cc16c1a20784^{commit}'
          git fetch --no-tags --depth=1 origin 104b57a6891ddae645c51e39eb3d27b89b64ffdf
          git cat-file -e '104b57a6891ddae645c51e39eb3d27b89b64ffdf^{commit}'
      - name: Verify unchanged complete check command contract
        timeout-minutes: 1
        run: node scripts/ci-check-contract.mjs
      - name: Build complete check artifacts
        timeout-minutes: 5
        run: npm run build
      - name: Prepare one-off external scheduling controller
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-file-schedule"
          cat > "$RUNNER_TEMP/linux-file-schedule-controller.mjs" <<'JS'
          // One-off diagnostic launcher; intentionally does not call production execute().
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync,spawn} from 'node:child_process';
          import {readFileSync,lstatSync,existsSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {availableParallelism} from 'node:os';
          const SOURCE_F='7c55503d63c27fb5ca3e03d33039cc16c1a20784';
          const INDEX='docs/evidence/qa/windows20-partitions/BASELINE_368_WINDOWS_PYTHON_PARTITIONS.json';
          const INDEX_SHA='e6097e39016595df5a930bb0c173bd90b441bb235c0782fa6636db3d5e05b186';
          const ONLY_ADDED='.github/workflows/linux-file-schedule-diagnostic.yml';
          const SOURCE_PINS={"docs/evidence/qa/windows20-partitions/BASELINE_368_WINDOWS_PYTHON_PARTITIONS.json":"e6097e39016595df5a930bb0c173bd90b441bb235c0782fa6636db3d5e05b186","docs/evidence/qa/windows20-partitions/WINDOWS_PYTHON_PARTITION_CASE_SOURCE_REVIEW.json":"8132d40b4394267a058fb4fee18575796061981c02ecf51d118355856d7a6497","scripts/check-python-partitions.mjs":"4ef5df2648ef909b4270413b9162a802db20d71d8f6e2b34d90f9d336980e2a0","scripts/ci-python-partition-driver.py":"e8b89a5aed517be5c1303ca135f9a4964ee58d451444e2e83090a4f363b128f3","scripts/ci-test-partitions.mjs":"cfd2c15e9cf8177f2c6f7a60870a3e63121bb3f019eb357b6692a6466038ce42","scripts/ci-test-reporter.mjs":"eeb87f9b07015eb9cf3cd220efb5aafb9a5e8cdb4cd62282ff89c45985f59515","scripts/test.mjs":"0693509f63143b63d4e2619884c4c12dd6333effc46124add4e2644c2d5287ad","tests/helpers/partitioned-python.mjs":"31b57009d667c0d88dfd73b849f0e9506e39ae9e26ab11b27b01cf0a3f9066f3","tests/six_boundary_history_acceptance.py":"1d360d565fc9f534fe27bca1dee6388f8faad516ff0ae57803aee6a23162aa55","tests/six_operation_scope_controls.py":"e4bc5488f629b6637a0adec4daf719134abe97ca123897f906da0ac8176ab570"};
          const root=process.cwd(),out=resolve(process.env.RUNNER_TEMP,'linux-file-schedule'),receipt=resolve(out,'diagnostic-full-concurrency2.receipt.json');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const git=args=>execFileSync('git',args,{cwd:root,encoding:'utf8',timeout:20000});
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          function absent(pid,group=false){try{process.kill(group?-pid:pid,0);return false;}catch(e){return e.code==='ESRCH';}}
          function snapshot(){return git(['ls-files','-z']).split('\0').filter(Boolean).sort().map(path=>{assert.ok(lstatSync(resolve(root,path)).isFile(),'Physical tracked source '+path);const raw=readFileSync(resolve(root,path));return {path,bytes:raw.length,sha256:sha(raw)};});}
          assert.equal(process.platform,'linux');assert.equal(Number(process.versions.node.split('.')[0]),22);assert.ok(!process.env.NODE_OPTIONS,'Diagnostic forbids NODE_OPTIONS overrides');
          assert.equal(process.env.CI_TEST_BASELINE_INDEX,INDEX);assert.equal(process.env.CI_TEST_BASELINE_SHA,INDEX_SHA);
          const actualCommit=git(['rev-parse','HEAD']).trim();assert.equal(actualCommit,process.env.GITHUB_SHA);
          assert.deepEqual(git(['diff','--no-renames','--name-only',SOURCE_F,'HEAD']).trim().split('\n'),[ONLY_ADDED]);assert.equal(git(['diff','--name-only']).trim(),'');
          for(const[path,pin]of Object.entries(SOURCE_PINS))assert.equal(sha(readFileSync(resolve(root,path))),pin,'Exact F source before import '+path);
          const F=await import(pathToFileURL(resolve(root,'scripts/ci-test-partitions.mjs')).href);
          const {loadBaseline,makeContext,nodeArguments,writeExclusive,verifyReceipt,ciIdentity,digest,inventory,MAX_FULL_MS}=F;
          assert.equal(MAX_FULL_MS,1800000);const checked=loadBaseline(root,resolve(root,INDEX),INDEX_SHA);assert.equal(checked.inventory.length,345);assert.equal(checked.baseline.legacy_test_count+checked.baseline.added_test_count,2092);
          const ci=ciIdentity();assert.ok(ci);assert.equal(ci.sha,actualCommit);
          const context=makeContext(root,checked,{commit:actualCommit,mode:'full',platform:process.platform,node:process.version,ci});
          assert.equal(context.node_major,22);assert.equal(context.platform,'linux');assert.deepEqual(context.selected_files,checked.inventory.map(r=>r.path));
          const originalArgv=nodeArguments(root,context);assert.equal(originalArgv[0],'--test');assert.ok(originalArgv[1].startsWith('--test-reporter='));assert.ok(originalArgv.every(a=>!a.startsWith('--test-concurrency')));
          assert.deepEqual(originalArgv.slice(2),context.selected_files.map(path=>resolve(root,path)));
          const actualArgv=[originalArgv[0],'--test-concurrency=2',...originalArgv.slice(1)];
          assert.deepEqual(actualArgv.filter(a=>a!=='--test-concurrency=2'),originalArgv);
          const before=snapshot();writeExclusive(resolve(out,'source-before.json'),before);
          const contextFile=receipt+'.context.json',eventsFile=receipt+'.events.json';assert.ok(!existsSync(receipt)&&!existsSync(eventsFile));writeExclusive(contextFile,{root:resolve(root),events_file:eventsFile,context});
          const declaration={schema:'one-off-full-Linux22-file-concurrency-diagnostic-v1',source_F:SOURCE_F,diagnostic_commit:actualCommit,ci,platform:process.platform,node:process.version,availableParallelism:availableParallelism(),runner:{ImageOS:process.env.ImageOS,ImageVersion:process.env.ImageVersion,RUNNER_OS:process.env.RUNNER_OS,RUNNER_ARCH:process.env.RUNNER_ARCH},originalArgv,actualArgv,diagnostic_override:{test_concurrency:2,production_execute_called:false,production_default_changed:false},child_bound_ms:MAX_FULL_MS,diagnostic_step_minutes:31,diagnostic_job_minutes:35,source_before_sha256:digest(JSON.stringify(before)),not_a_Windows_release_reference_or_adoption_approval:true};
          writeExclusive(resolve(out,'diagnostic-declaration.json'),declaration);
          const env={...process.env,PALI_CI_TEST_CONTEXT:contextFile};delete env.NODE_TEST_CONTEXT;
          let child,ownedPid=null,spawnError=null,timedOut=false,exitObserved=false,exitCode=null,exitSignal=null,closeObserved=false,closeCode=null,closeSignal=null,killError=null,forcedClose=false,timeoutCleanupStarted=null,groupSignalAttempted=false;
          const started=performance.now();
          await new Promise(done=>{
           let timer,closeGuard,settled=false;const settle=()=>{if(settled)return;settled=true;clearTimeout(timer);clearTimeout(closeGuard);done();};
           try{child=spawn(process.execPath,actualArgv,{cwd:root,stdio:'inherit',detached:true,env});ownedPid=child.pid;}
           catch(e){spawnError=e.code??e.name;settle();return;}
           child.once('error',e=>{spawnError=e.code??e.name;});
           child.once('exit',(code,signal)=>{exitObserved=true;exitCode=code;exitSignal=signal;});
           child.once('close',(code,signal)=>{closeObserved=true;closeCode=code;closeSignal=signal;settle();});
           timer=setTimeout(()=>{timedOut=true;timeoutCleanupStarted=performance.now();if(child.pid===ownedPid&&Number.isSafeInteger(ownedPid)&&ownedPid>1&&!exitObserved&&!closeObserved&&child.exitCode===null&&child.signalCode===null){groupSignalAttempted=true;try{process.kill(-ownedPid,'SIGKILL');}catch(e){killError=e.code??e.name;}}else{killError='NO_LIVE_HANDLE_AT_DEADLINE';}closeGuard=setTimeout(()=>{forcedClose=true;settle();},5000);},MAX_FULL_MS);
          });
          let finalPidAbsent=ownedPid?absent(ownedPid):false,finalGroupAbsent=ownedPid?absent(ownedPid,true):false;
          // Cleanup is bounded and restricted to the actual detached ChildProcess group.
          const cleanupStart=performance.now();
          if(ownedPid&&(!finalPidAbsent||!finalGroupAbsent)){
           const until=(timeoutCleanupStarted??cleanupStart)+5000;
           while(performance.now()+25<until&&(!absent(ownedPid)||!absent(ownedPid,true)))await pause(25);
           finalPidAbsent=absent(ownedPid);finalGroupAbsent=absent(ownedPid,true);
          }
          const cleanupMs=performance.now()-cleanupStart,timeoutCleanupMs=timeoutCleanupStarted===null?null:performance.now()-timeoutCleanupStarted;
          const cleanupUnverified=!(exitObserved&&closeObserved&&finalPidAbsent&&finalGroupAbsent)||cleanupMs>5000||(timeoutCleanupMs!==null&&timeoutCleanupMs>5000);
          const execution={exit_code:closeCode,signal:closeSignal,error:spawnError,timed_out:timedOut,cleanup_unverified:cleanupUnverified,bound_ms:MAX_FULL_MS};
          let events=null,eventsParseError=null,eventsRaw=null;
          if(existsSync(eventsFile)){eventsRaw=readFileSync(eventsFile);try{events=JSON.parse(eventsRaw.toString('utf8'));}catch(e){eventsParseError=e.name+': '+e.message;}}
          const result={schema:'complete-ci-test-receipt-v1',events,execution};writeExclusive(receipt,result);
          let verified=false,verificationError=null,after=null,originalVerifierCalled=false;
          try{
           assert.equal(execution.exit_code,0);assert.equal(execution.signal,null);assert.equal(execution.error,null);assert.equal(execution.timed_out,false);assert.equal(execution.cleanup_unverified,false);
           assert.equal(exitCode,0);assert.equal(exitSignal,null);assert.equal(forcedClose,false);assert.equal(groupSignalAttempted,false);assert.ok(events?.complete);assert.deepEqual(events.context,context);assert.equal(events.context_sha256,digest(JSON.stringify(context)));
           const checkedAfter=loadBaseline(root,resolve(root,INDEX),INDEX_SHA);assert.deepEqual(checkedAfter,checked);assert.deepEqual(inventory(root),checked.inventory);
           for(const[path,pin]of Object.entries(SOURCE_PINS))assert.equal(sha(readFileSync(resolve(root,path))),pin,'Exact F source after test '+path);
           after=snapshot();assert.deepEqual(after,before,'Every tracked physical source byte remains exact');assert.equal(git(['diff','--name-only']).trim(),'');
           originalVerifierCalled=true;const verifiedEvents=verifyReceipt(result,checked,actualCommit,ci,22);
           assert.equal(verifiedEvents.summary.tests,2092);assert.equal(verifiedEvents.summary.pass,1814);assert.equal(verifiedEvents.summary.skipped,278);
           for(const key of ['fail','cancelled','todo'])assert.equal(verifiedEvents.summary[key],0);
           assert.equal(verifiedEvents.cases.filter(row=>row.type==='test').length,2092);assert.deepEqual(verifiedEvents.context.selected_files,context.selected_files);
           verified=true;
          }catch(e){verificationError=e.name+': '+e.message;}
          if(after)writeExclusive(resolve(out,'source-after.json'),after);
          writeExclusive(resolve(out,'diagnostic-result.json'),{...declaration,verified,verificationError,seconds:(performance.now()-started)/1000,pid:ownedPid,exitObserved,exitCode,exitSignal,closeObserved,closeCode,closeSignal,finalPidAbsent,finalGroupAbsent,cleanup_ms:cleanupMs,timeout_cleanup_ms:timeoutCleanupMs,killError,forcedClose,groupSignalAttempted,eventsParseError,events_file_sha256:eventsRaw?sha(eventsRaw):null,general_descendant_absence_guarantee:false,receipt_sha256:sha(readFileSync(receipt)),summary:events?.summary??null,reporter_event_rows_unmodified:true,emitted_event_rows:events?.cases?.length??null,original_verifyReceipt_called:originalVerifierCalled});
          if(!verified){console.error('Linux scheduling diagnostic refused: '+verificationError);process.exitCode=1;if(forcedClose)process.exit(1);}
          JS
      - name: Run all 345 F test files with explicit diagnostic concurrency 2
        timeout-minutes: 31
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/linux-file-schedule-controller.mjs" 2>&1 | tee "$RUNNER_TEMP/linux-file-schedule/diagnostic-full.tap"
      - name: Preserve unmodified reporter receipt and explicit override evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux22-file-concurrency2-diagnostic
          path: ${{ runner.temp }}/linux-file-schedule/
          if-no-files-found: warn
          retention-days: 7
