name: Deploy to Fly.io
# Deploys the hosted /mcp endpoint. Does nothing until a maintainer adds the FLY_API_TOKEN
# repository secret (see docs/hosting.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "FLY_API_TOKEN is not set; skipping deploy."; fi
  deploy:
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the deployed endpoint
        run: |
          app=$(grep -E '^app *=' fly.toml | sed -E 's/.*"(.*)".*/\1/')
          for i in $(seq 1 20); do curl -fsS "https://$app.fly.dev/healthz" && exit 0; sleep 3; done
          exit 1
