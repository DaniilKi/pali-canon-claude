name: Bug report
description: Something does not work (installing, starting, a tool failing, an error message).
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Plain English is fine; you do not need to be technical.
        - A **wrong citation or translation link**? Please use the "Wrong citation or link" form instead.
        - A **security problem**? Please do not post it here; see [SECURITY.md](https://github.com/DaniilKi/pali-canon-claude/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Paste any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app were you using?
      options:
        - Claude Desktop (extension)
        - Claude Code (plugin)
        - Hosted version (Claude on the web or phone)
        - Another AI app or MCP client
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: For example 2.1.0. If you do not know, leave it blank.
      placeholder: "2.1.0"
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04…"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
      description: If you can, list the steps or the exact question you asked the assistant.
